<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Судоку</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/5190/5190595.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-wrapper">
        <!-- Левый бар (заголовок, переключатель сложности, статистика) -->
        <aside class="side-panel left-panel">
            <header>
                <h1>Судоку</h1>
                <div id="game-status" class="status-badge">В процессе</div>
            </header>

            <div class="difficulty-group">
                <button class="diff-btn active" data-diff="easy">Легкий</button>
                <button class="diff-btn" data-diff="medium">Средний</button>
                <button class="diff-btn" data-diff="hard">Сложный</button>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">Время</span>
                    <span id="timer" class="status-val">00:00</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Ошибки</span>
                    <span id="mistakes" class="status-val">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Сложность</span>
                    <span id="difficulty-text" class="status-val">Легкий</span>
                </div>
            </div>
        </aside>

        <!-- Центральная часть (игровое поле и системные уведомления) -->
        <main class="center-panel">
            <!-- 9x9 Board -->
            <div id="grid" class="grid-container"></div>
            <div id="message-banner" class="message-banner"></div>
        </main>

        <!-- Правый бар (цифровая клавиатура, кнопки действий, таблица рекордов) -->
        <aside class="side-panel right-panel">
            <!-- Keypad -->
            <div class="numpad">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
                <button class="num-btn erase-btn" id="btn-erase">Стереть</button>
            </div>

            <!-- Action Buttons -->
            <div class="controls-row">
                <button class="btn btn-flex" id="btn-new">Новая игра</button>
                <button class="btn btn-flex" id="btn-check">Проверить</button>
                <button class="btn btn-flex" id="btn-hint">Подсказка</button>
            </div>

            <!-- High scores list -->
            <div class="records-panel">
                <div class="records-title">
                    <span>Лучшее время</span>
                    <span style="cursor:pointer; text-decoration: underline;" id="btn-reset-records">Сброс</span>
                </div>
                <div class="records-grid">
                    <div class="records-item">
                        <span>Легкий</span>
                        <span id="rec-easy">--:--</span>
                    </div>
                    <div class="records-item">
                        <span>Средний</span>
                        <span id="rec-medium">--:--</span>
                    </div>
                    <div class="records-item">
                        <span>Сложный</span>
                        <span id="rec-hard">--:--</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Win Modal Dialog -->
    <div id="win-modal" class="modal">
        <div class="modal-card">
            <h2>Победа!</h2>
            <p id="win-description">Вы успешно решили судоку.</p>
            <button class="btn" style="width: 100%; padding: 10px;" id="modal-new-game-btn">Играть снова</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
